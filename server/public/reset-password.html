<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe - DavidSTORE</title>
<style>
  body { font-family: Arial, sans-serif; background: #0B3D91; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #fff; border-radius: 12px; padding: 32px; max-width: 380px; width: 90%; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
  h1 { color: #0B3D91; font-size: 20px; margin-top: 0; }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
  button { width: 100%; padding: 12px; background: #FFC107; color: #0B3D91; font-weight: bold; border: none; border-radius: 6px; margin-top: 12px; cursor: pointer; font-size: 15px; }
  button:disabled { opacity: 0.6; }
  #message { margin-top: 14px; font-size: 14px; text-align: center; }
  .error { color: #c00; }
  .success { color: #0a0; }
</style>
</head>
<body>
<div class="card">
  <h1>Nouveau mot de passe DavidSTORE</h1>
  <form id="resetForm">
    <input type="password" id="newPassword" placeholder="Nouveau mot de passe (6 caracteres min.)" minlength="6" required>
    <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" minlength="6" required>
    <button type="submit" id="submitBtn">Réinitialiser</button>
  </form>
  <div id="message"></div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('resetForm');
  const messageDiv = document.getElementById('message');
  const submitBtn = document.getElementById('submitBtn');

  if (!token) {
    messageDiv.textContent = 'Lien invalide : token manquant.';
    messageDiv.className = 'error';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      messageDiv.textContent = 'Les mots de passe ne correspondent pas.';
      messageDiv.className = 'error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'En cours...';
    messageDiv.textContent = '';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();
      if (res.ok) {
        messageDiv.textContent = 'Mot de passe réinitialisé avec succès. Vous pouvez fermer cette page et vous reconnecter.';
        messageDiv.className = 'success';
        form.style.display = 'none';
      } else {
        messageDiv.textContent = data.error || 'Une erreur est survenue.';
        messageDiv.className = 'error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Réinitialiser';
      }
    } catch (err) {
      messageDiv.textContent = 'Erreur réseau, réessayez.';
      messageDiv.className = 'error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Réinitialiser';
    }
  });
</script>
</body>
</html>
